name: Suite de regresión
on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test carrito.spec.js checkout.spec.js integracion.spec.js
      - run: npx jest --testPathIgnorePatterns="(carrito|checkout|integracion|login)\.spec\.js"